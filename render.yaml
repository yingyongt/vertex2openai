services:
  - type: web
    name: agentplatform2api
    env: docker
    region: singapore
    healthCheckPath: /
    envVars:
      - key: API_KEY
        value: change-me-please
      - key: VERTEX_EXPRESS_API_KEY
        value: your_vertex_express_api_key
      - key: STATE_DIR
        value: /data
